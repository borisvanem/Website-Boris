<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boris – Photography</title>
<meta name="description" content="Real estate, fashion, sports, artist, ecommerce en lifestyle fotografie door Boris.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0807; --fg:#f6f3ee; --muted:#9a948b; --gold:#d9a85b; --line:#241f1b;
          --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--fg); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }

  /* ---------- Navigatie ---------- */
  .nav { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
         padding:22px 4vw; background:linear-gradient(#000000b3,transparent); }
  .nav .logo { font-family:var(--serif); font-size:2rem; letter-spacing:.02em; }
  .nav .links { display:flex; gap:38px; font-size:1rem; }
  .nav .links a { color:#ffffffcc; padding-bottom:4px; border-bottom:1px solid transparent; }
  .nav .links a:hover { color:#fff; }
  .nav .links a.actief { color:#fff; border-color:var(--gold); }
  .nav .contact { font-size:.8rem; letter-spacing:.25em; text-transform:uppercase; color:#ffffffcc; }
  .nav .contact:hover { color:var(--gold); }
  @media (max-width:820px) {
    .nav { flex-wrap:wrap; gap:10px; padding:14px 5vw; background:#0a0807ee; }
    .nav .links { order:3; width:100%; gap:20px; font-size:.9rem; overflow-x:auto; }
  }

  /* ---------- Homepagina: stroken ---------- */
  .strip { position:relative; display:flex; flex-direction:column; justify-content:flex-end; min-height:78vh; padding:0 6vw 8vh;
           background-size:cover; background-position:center; overflow:hidden; }
  .strip::before { content:""; position:absolute; inset:0; background:linear-gradient(#00000030,#000000a0); transition:background .5s; }
  .strip:hover::before { background:linear-gradient(#00000010,#00000080); }
  .strip > * { position:relative; }
  .strip .nr { color:var(--gold); letter-spacing:.3em; font-size:.85rem; margin-bottom:6px; }
  .strip h2 { font-family:var(--serif); font-weight:400; text-transform:uppercase; letter-spacing:.04em; line-height:1;
              font-size:clamp(3.2rem,13vw,11.5rem); }
  .strip .sub { margin-top:28px; letter-spacing:.35em; font-size:.85rem; text-transform:uppercase; color:#ffffffcc; }
  .strip .ga { margin-top:36px; color:var(--gold); letter-spacing:.35em; font-size:.8rem; text-transform:uppercase; }
  .strip .ga span { display:inline-block; transition:transform .3s; margin-left:10px; }
  .strip:hover .ga span { transform:translateX(8px); }

  /* ---------- Categoriepagina: galerij ---------- */
  .pagina { padding:130px 4vw 80px; max-width:1500px; margin:0 auto; }
  .kop { margin-bottom:40px; }
  .kop .terug { color:var(--gold); letter-spacing:.3em; font-size:.75rem; text-transform:uppercase; }
  .kop h1 { font-family:var(--serif); font-weight:400; text-transform:uppercase; letter-spacing:.04em; font-size:clamp(2.4rem,7vw,5rem); line-height:1.05; margin-top:10px; }
  .kop p { color:var(--muted); margin-top:8px; letter-spacing:.2em; text-transform:uppercase; font-size:.8rem; }
  .galerij { columns:3 320px; column-gap:24px; }
  .foto { break-inside:avoid; margin-bottom:24px; position:relative; cursor:pointer; overflow:hidden; background:#161210; }
  .foto img { width:100%; display:block; transition:transform .6s, opacity .3s; }
  .foto:hover img { transform:scale(1.03); opacity:.92; }
  .foto .ph { width:100%; display:flex; align-items:center; justify-content:center; color:#ffffff80; letter-spacing:.2em; font-size:.75rem; text-transform:uppercase; }
  .foto .play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:60px; height:60px; border-radius:50%;
                background:#000a; display:flex; align-items:center; justify-content:center; padding-left:4px; pointer-events:none; }
  .foto .titel { position:absolute; left:0; right:0; bottom:0; padding:36px 16px 12px; font-size:.85rem;
                 background:linear-gradient(transparent,#000c); opacity:0; transition:opacity .3s; }
  .foto:hover .titel { opacity:1; }
  .leeg { color:var(--muted); }

  /* ---------- Tekstpagina's ---------- */
  .tekst { max-width:720px; }
  .tekst p { color:#d8d3cb; margin-bottom:18px; font-size:1.05rem; }
  .knop { display:inline-block; margin-top:10px; padding:13px 30px; border:1px solid var(--gold); color:var(--gold);
          letter-spacing:.25em; font-size:.8rem; text-transform:uppercase; transition:.3s; }
  .knop:hover { background:var(--gold); color:#111; }

  footer { text-align:center; color:var(--muted); font-size:.78rem; letter-spacing:.15em; padding:30px 20px 40px; border-top:1px solid var(--line); }

  /* ---------- Lightbox ---------- */
  #lb { position:fixed; inset:0; background:#000000f2; display:none; align-items:center; justify-content:center; z-index:30; padding:24px; }
  #lb.open { display:flex; }
  #lb-in { width:100%; display:flex; justify-content:center; }
  #lb img { max-width:100%; max-height:90vh; }
  #lb iframe { width:min(1100px,100%); aspect-ratio:16/9; border:0; }
  #lb video { max-width:100%; max-height:90vh; }
  #lb button { position:absolute; background:none; border:0; color:#fff; cursor:pointer; font-size:2.4rem; padding:14px; opacity:.8; }
  #lb button:hover { opacity:1; }
  #lb .x { top:10px; right:18px; } #lb .v { left:10px; top:50%; } #lb .n { right:10px; top:50%; }
</style>
</head>
<body>

<nav class="nav" id="nav">
  <a class="logo" href="#/">Boris</a>
  <div class="links">
    <a href="#/" data-n="foto">Photography</a>
    <a href="#/dj" data-n="dj">DJ Vanem</a>
    <a href="#/c/content" data-n="content">Content</a>
    <a href="#/about" data-n="about">About</a>
  </div>
  <a class="contact" href="#/contact">Contact</a>
</nav>

<div id="app"></div>

<footer>© 2026 BORIS</footer>

<div id="lb"><button class="x" aria-label="Sluiten">&times;</button><button class="v" aria-label="Vorige">&#8249;</button><button class="n" aria-label="Volgende">&#8250;</button><div id="lb-in"></div></div>

<script>
/* =====================================================================
   HIER PAS JE ALLES AAN
   ===================================================================== */

/* ---- Algemene gegevens ---- */
const site = {
  email: "jouw@email.nl",
  over: [
    "Schrijf hier een korte tekst over jezelf: wie je bent, wat je maakt en waar je werkt.",
    "Vertel ook voor wie je al gewerkt hebt, of waarvoor mensen je kunnen inhuren."
  ]
};

/* ---- De stroken op de homepagina ----
   id     = korte naam zonder spaties of hoofdletters (wordt gebruikt bij je foto's hieronder)
   cover  = de achtergrondfoto van de strook, bijvoorbeeld "media/covers/real-estate.jpg"
            (laat leeg tot je een foto hebt, dan zie je een kleur) */
const categorieen = [
  { id:"real-estate", naam:"Real Estate", sub:"Architecture, interiors, villas", cover:"", kleur:"#2f4156" },
  { id:"fashion",     naam:"Fashion",     sub:"Ecom, travel, lifestyle",         cover:"", kleur:"#6b5b4f" },
  { id:"sports",      naam:"Sports",      sub:"Athletes, action, energy",        cover:"", kleur:"#7a3b2e" },
  { id:"artist",      naam:"Artist",      sub:"Portraits, press, covers",        cover:"", kleur:"#3d3556" },
  { id:"ecommerce",   naam:"Ecommerce",   sub:"Fashion brands, sports brands, products", cover:"", kleur:"#4a5a45" },
  { id:"lifestyle",   naam:"Lifestyle",   sub:"People, places, moments",         cover:"", kleur:"#6e5a3c" },
];

/* ---- DJ Vanem: de stroken per genre (werkt precies zoals de fotografie-stroken) ---- */
const djGenres = [
  { id:"dj-afro-house",    naam:"Afro House",    sub:"Deep rhythms, warm percussion",   cover:"", kleur:"#7a4a1e" },
  { id:"dj-tech-house",    naam:"Tech House",    sub:"Driving basslines, club energy",  cover:"", kleur:"#1f3a4d" },
  { id:"dj-funky-house",   naam:"Funky House",   sub:"Groove, soul, good vibes",        cover:"", kleur:"#6b2f52" },
  { id:"dj-jacking-house", naam:"Jacking House", sub:"Raw, bouncy, dancefloor classics", cover:"", kleur:"#3d5a2f" },
];

/* ---- Extra pagina (Content) ---- */
const extra = {
  content: { naam:"Content",  sub:"Video, social, campaigns",  kleur:"#3a3a3a" },
};

/* ---- Je foto's en video's ----
   Een foto:     { cat:"sports", src:"media/sports/foto1.jpg", titel:"Gym session" }
   YouTube:      { cat:"content", type:"youtube", id:"ABC123xyz", titel:"Aftermovie" }
   Videobestand: { cat:"dj", type:"video", src:"media/dj/clip.mp4", titel:"Set" }
   De cat moet gelijk zijn aan een id hierboven (bijvoorbeeld "sports", "dj-afro-house" of "content").
   Een categorie zonder werk toont voorbeeldvlakken. Zodra je er echte foto's in zet, verdwijnen die. */
const werk = [
  // { cat:"real-estate", src:"media/real-estate/villa1.jpg", titel:"Villa" },
  // { cat:"sports",      src:"media/sports/gym1.jpg",        titel:"Gym" },
];

/* =====================================================================
   Vanaf hier hoef je niets meer aan te passen
   ===================================================================== */
const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = document.getElementById('app');
const lb = document.getElementById('lb'), lbIn = document.getElementById('lb-in');
let huidig = [], lbIdx = 0;

function stroken(lijst) {
  app.innerHTML = lijst.map((c, i) => {
    const bg = c.cover ? `background-image:url('${E(c.cover)}');background-color:${c.kleur}` : `background:linear-gradient(135deg,${c.kleur},#0a0807)`;
    return `<a class="strip" href="#/c/${E(c.id)}" style="${bg}">
      <div class="nr">${String(i + 1).padStart(2, '0')}</div>
      <h2>${E(c.naam)}</h2>
      <div class="sub">${E(c.sub)}</div>
      <div class="ga">View work <span>→</span></div></a>`;
  }).join('');
}

function home() { document.title = 'Boris – Photography'; stroken(categorieen); }
function dj() { document.title = 'DJ Vanem – Boris'; stroken(djGenres); }

function categorie(id) {
  const c = categorieen.find(x => x.id === id) || djGenres.find(x => x.id === id) || extra[id];
  if (!c) return home();
  const isDj = id.startsWith('dj-');
  const terug = isDj ? '<a class="terug" href="#/dj">← DJ Vanem</a>' : '<a class="terug" href="#/">← Photography</a>';
  document.title = c.naam + ' – Boris';
  let items = werk.filter(w => w.cat === id);
  if (!items.length) {
    const hoogtes = [360, 260, 440, 300, 380, 280];
    items = hoogtes.map((h, i) => ({ cat:id, placeholder:true, h, titel:'Voorbeeld ' + (i + 1), kleur:c.kleur }));
  }
  huidig = items;
  app.innerHTML = `<div class="pagina">
    <div class="kop">${terug}<h1>${E(c.naam)}</h1><p>${E(c.sub)}</p></div>
    <div class="galerij">${items.map((w, i) => foto(w, i)).join('')}</div></div>`;
  app.querySelectorAll('.foto').forEach(el => el.addEventListener('click', () => openLb(+el.dataset.i)));
}

function foto(w, i) {
  const vid = w.type === 'youtube' || w.type === 'video';
  let inhoud;
  if (w.placeholder) inhoud = `<div class="ph" style="background:linear-gradient(160deg,${w.kleur},#0a0807);height:${w.h}px">${E(w.titel)}</div>`;
  else if (w.type === 'youtube') inhoud = `<img src="https://img.youtube.com/vi/${E(w.id)}/hqdefault.jpg" alt="${E(w.titel)}" loading="lazy">`;
  else if (w.type === 'video') inhoud = `<video src="${E(w.src)}#t=0.5" preload="metadata" muted style="width:100%;display:block"></video>`;
  else inhoud = `<img src="${E(w.src)}" alt="${E(w.titel)}" loading="lazy">`;
  return `<div class="foto" data-i="${i}">${inhoud}${vid ? '<span class="play">▶</span>' : ''}${w.titel && !w.placeholder ? `<div class="titel">${E(w.titel)}</div>` : ''}</div>`;
}

function tekst(titel, html) {
  document.title = titel + ' – Boris';
  app.innerHTML = `<div class="pagina"><div class="kop"><a class="terug" href="#/">← Photography</a><h1>${E(titel)}</h1></div><div class="tekst">${html}</div></div>`;
}

function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  let n = 'foto';
  if (p[0] === 'dj') { dj(); n = 'dj'; }
  else if (p[0] === 'c' && p[1]) { categorie(p[1]); n = p[1].startsWith('dj-') ? 'dj' : p[1] === 'content' ? 'content' : 'foto'; }
  else if (p[0] === 'about') { tekst('About', site.over.map(t => `<p>${E(t)}</p>`).join('')); n = 'about'; }
  else if (p[0] === 'contact') { tekst('Contact', `<p>Een project in gedachten? Stuur me gerust een bericht.</p><a class="knop" href="mailto:${E(site.email)}">${E(site.email)}</a>`); n = 'contact'; }
  else home();
  document.querySelectorAll('.nav .links a').forEach(a => a.classList.toggle('actief', a.dataset.n === n));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

/* ---- Lightbox ---- */
function toonLb() {
  const w = huidig[lbIdx];
  if (w.placeholder) return;
  lbIn.innerHTML = w.type === 'youtube' ? `<iframe src="https://www.youtube-nocookie.com/embed/${E(w.id)}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`
                 : w.type === 'video' ? `<video src="${E(w.src)}" controls autoplay></video>`
                 : `<img src="${E(w.src)}" alt="${E(w.titel)}">`;
}
function openLb(i) { if (huidig[i].placeholder) return; lbIdx = i; lb.classList.add('open'); toonLb(); }
function sluitLb() { lb.classList.remove('open'); lbIn.innerHTML = ''; }
function stap(d) {
  const echte = huidig.map((w, i) => i).filter(i => !huidig[i].placeholder);
  if (echte.length < 2) return;
  lbIdx = echte[(echte.indexOf(lbIdx) + d + echte.length) % echte.length]; toonLb();
}
lb.querySelector('.x').onclick = sluitLb;
lb.querySelector('.v').onclick = () => stap(-1);
lb.querySelector('.n').onclick = () => stap(1);
lb.addEventListener('click', e => { if (e.target === lb) sluitLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') sluitLb(); if (e.key === 'ArrowLeft') stap(-1); if (e.key === 'ArrowRight') stap(1);
});
</script>
</body>
</html>
